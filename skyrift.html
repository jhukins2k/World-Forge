<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Skyrift — Sprite-Stack Sky Arena</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#090717;color:#eef;font-family:"Trebuchet MS",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,8,30,.25),rgba(5,4,15,.8));z-index:5;overflow:auto;touch-action:auto}
#ov.hide{display:none}
.panel{text-align:center;max-width:580px;padding:24px 20px;margin:auto}
h1{font-size:clamp(46px,11vw,88px);margin:0;letter-spacing:.12em;background:linear-gradient(180deg,#fff,#7fe3ff 55%,#b46bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #2a1850)}
h2{font-size:clamp(34px,8vw,60px);margin:0;letter-spacing:.1em}
h3{margin:0 0 6px;font-size:14px;letter-spacing:.12em;opacity:.7;font-weight:400}
.sub{opacity:.8;margin:6px 0 18px;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
button{font:inherit;cursor:pointer}
button.play{font-size:20px;font-weight:700;letter-spacing:.15em;padding:14px 44px;border:0;border-radius:10px;background:linear-gradient(180deg,#ffd23f,#ff9a3c);color:#2a1630;box-shadow:0 5px 0 #a8501e,0 10px 30px rgba(255,170,60,.35)}
button.play:active{transform:translateY(3px);box-shadow:0 2px 0 #a8501e}
button.play:disabled{opacity:.5}
button.btn2{font-size:15px;font-weight:700;padding:11px 18px;min-height:44px;border:1px solid rgba(127,227,255,.5);border-radius:9px;background:rgba(63,208,255,.12);color:#cdf4ff}
button.ghost{font-size:14px;margin-top:12px;padding:8px 20px;min-height:40px;border:1px solid rgba(255,255,255,.3);border-radius:8px;background:transparent;color:#dde}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:10px;padding:4px;gap:4px;flex-wrap:wrap;justify-content:center}
.seg button{border:0;background:transparent;color:#cce;padding:9px 13px;border-radius:7px;font-size:14px;min-height:40px}
.seg button.on{background:#3fd0ff;color:#0b0820;font-weight:700}
.desc{font-size:13px;opacity:.75;margin:8px 0 18px;min-height:18px}
.inp{font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;text-align:center;width:210px;margin-bottom:14px}
.inp.code{font-size:26px;letter-spacing:.3em;text-transform:uppercase;width:220px}
.bigcode{font-size:clamp(38px,10vw,54px);letter-spacing:.25em;font-weight:700;color:#ffd23f;margin:2px 0 6px;padding-left:.25em}
.plist{display:flex;flex-direction:column;gap:6px;margin:14px auto;max-width:280px;text-align:left}
.plist div{background:rgba(255,255,255,.06);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;text-align:left;margin:22px auto 0;font-size:13px;max-width:400px;opacity:.9}
.ctl b{color:#ffd23f;white-space:nowrap}
.stats{font-size:16px;margin:10px 0 22px;opacity:.92;line-height:1.6}
.tip{font-size:12px;opacity:.6;margin-top:16px;line-height:1.5}
.err{color:#ff9aa8;font-size:15px;line-height:1.5;margin:14px 0}
.link{font-size:12px;opacity:.7;word-break:break-all;margin-top:8px;user-select:text;-webkit-user-select:text}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"></div>
<script>
'use strict';
// ================= UTIL =================
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const ov=document.getElementById('ov');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const dist=(ax,ay,bx,by)=>Math.hypot(bx-ax,by-ay);
const r1=v=>Math.round(v*10)/10, r2=v=>Math.round(v*100)/100;
const angTo=(a,b)=>((b-a+Math.PI*3)%TAU)-Math.PI;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function makeNoise(rng){const p=new Float32Array(65536);for(let i=0;i<65536;i++)p[i]=rng();
  return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const g=(a,b)=>p[((a&255)<<8)|(b&255)];
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(g(xi,yi),g(xi+1,yi),u),lerp(g(xi,yi+1),g(xi+1,yi+1),u),v);};}
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const jit=(c,a,r)=>[c[0]+(r()-.5)*a,c[1]+(r()-.5)*a,c[2]+(r()-.5)*a];
const mul=(c,f)=>[c[0]*f,c[1]*f,c[2]*f];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
let SR=Math.random; // seeded random used during world setup

let W=0,H=0,DPR=1,zoom=1,touchMode=matchMedia('(pointer:coarse)').matches;
function ST(a,b,c,d,e,f){ctx.setTransform(a*DPR,b*DPR,c*DPR,d*DPR,e*DPR,f*DPR);}
function resize(){DPR=Math.min(window.devicePixelRatio||1,touchMode?1.5:2);W=innerWidth;H=innerHeight;
  cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);zoom=clamp(Math.sqrt(W*H)/760,0.66,2.1);layoutButtons();}

// ================= VOXEL / SPRITE STACK =================
class Vox{
  constructor(w,d,h){this.w=w;this.d=d;this.h=h;this.v=new Array(w*d*h).fill(null);}
  set(x,y,z,c){if(c==null)return;x=Math.floor(x);y=Math.floor(y);z=Math.floor(z);
    if(x<0||y<0||z<0||x>=this.w||y>=this.d||z>=this.h)return;this.v[(z*this.d+y)*this.w+x]=c;}
  get(x,y,z){if(x<0||y<0||z<0||x>=this.w||y>=this.d||z>=this.h)return null;return this.v[(z*this.d+y)*this.w+x];}
  box(x0,y0,z0,x1,y1,z1,c){for(let z=z0;z<z1;z++)for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)this.set(x,y,z,typeof c=='function'?c(x,y,z):c);}
  ell(cx,cy,cz,rx,ry,rz,c){for(let z=Math.floor(cz-rz);z<=Math.ceil(cz+rz);z++)for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
    const a=(x+.5-cx)/rx,b=(y+.5-cy)/ry,e=(z+.5-cz)/rz;if(a*a+b*b+e*e<=1)this.set(x,y,z,typeof c=='function'?c(x,y,z):c);}}
  cyl(cx,cy,r,z0,z1,c){for(let z=z0;z<z1;z++)for(let y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++)for(let x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++){
    const a=x+.5-cx,b=y+.5-cy;if(a*a+b*b<=r*r)this.set(x,y,z,typeof c=='function'?c(x,y,z):c);}}
  bake(){const slices=[],white=[];const{w,d,h}=this;
    for(let z=0;z<h;z++){const cv=mk(w,d),wc=mk(w,d),g=cv.getContext('2d'),gw=wc.getContext('2d');
      const im=g.createImageData(w,d),iw=gw.createImageData(w,d);let any=false;
      for(let y=0;y<d;y++)for(let x=0;x<w;x++){const c=this.get(x,y,z);if(!c)continue;any=true;
        let sh=0.6+0.4*z/Math.max(1,h-1);if(!this.get(x,y,z+1))sh*=1.13;
        if(!this.get(x-1,y,z)||!this.get(x+1,y,z)||!this.get(x,y-1,z)||!this.get(x,y+1,z))sh*=0.84;
        const i=(y*w+x)*4;im.data[i]=clamp(c[0]*sh,0,255);im.data[i+1]=clamp(c[1]*sh,0,255);im.data[i+2]=clamp(c[2]*sh,0,255);im.data[i+3]=255;
        iw.data[i]=iw.data[i+1]=iw.data[i+2]=iw.data[i+3]=255;}
      if(any){g.putImageData(im,0,0);gw.putImageData(iw,0,0);}
      slices.push(any?cv:null);white.push(any?wc:null);}
    return{w,d,h,slices,white};}
}

// ================= MODELS =================
function mkHunter(main,acc,frame){
  const m=new Vox(14,14,16),M=hx(main),A=hx(acc),D=[42,40,58],S=[95,95,118],G=[160,255,240];
  const lx=frame===0?[5,7]:frame===1?[7,5]:[6,6];
  m.box(lx[0],4,0,lx[0]+3,6,4,D);m.box(lx[1],8,0,lx[1]+3,10,4,D);
  m.box(5,3,4,10,11,10,M);m.box(5,3,4,10,11,5,A);
  m.box(3,4,5,5,10,10,mul(A,0.75));
  m.box(5,1,6,9,3,9,M);m.box(5,11,6,9,13,9,M);
  m.box(5,4,10,10,10,14,M);m.box(9,5,11,10,9,13,G);
  m.box(6,5,14,9,9,15,A);
  m.box(8,11,7,14,13,9,S);m.box(13,11,7,14,13,9,A);
  return m.bake();
}
function mkGlider(main,acc){const m=new Vox(12,26,2),M=hx(main),A=hx(acc);
  for(let y=0;y<26;y++){const o=Math.abs(y-12.5);const x0=Math.floor(2+o*0.35);for(let x=x0;x<9;x++)m.set(x,y,0,(x===x0||o>11.5)?A:M);}
  m.box(4,11,1,9,15,2,A);return m.bake();}
function mkTree(type,leaf,rng){
  const m=new Vox(20,20,30),trunk=[112,78,56];
  const lf=(x,y,z)=>rng()<0.07?null:jit(mul(leaf,0.9+rng()*0.2),24,rng);
  if(type===2){const sh=10+(rng()*6|0);m.cyl(10,10,1.9,0,sh,()=>jit([235,226,214],12,rng));
    m.ell(10,10,sh+1,7.5,7.5,4.5,(x,y,z)=>z<sh-1?null:(rng()<0.08?[255,250,240]:jit(leaf,18,rng)));return m.bake();}
  m.cyl(10,10,1.7,0,type===1?8:12,()=>jit(trunk,18,rng));
  if(type===0){m.ell(10,10,15,7.5,7.5,6,lf);m.ell(10,10,20.5,5.5,5.5,4.5,lf);m.ell(6+rng()*8,6+rng()*8,13,4,4,3,lf);}
  else{for(let z=6;z<29;z++){const r=(29-z)*0.34+0.7-((z%4)===0?0.9:0);m.cyl(10,10,Math.max(0.6,r),z,z+1,lf);}}
  return m.bake();
}
function mkRock(rng){const m=new Vox(16,16,12),b=[118+rng()*20,112,134];
  const f=(x,y,z)=>z>6&&rng()<0.45?jit([92,150,86],24,rng):jit(b,26,rng);
  m.ell(8,8,1,6.5+rng(),5.5+rng(),8+rng()*2,f);m.ell(5+rng()*6,5+rng()*6,0,3.5,3.5,5,f);return m.bake();}
function mkPillar(rng){const m=new Vox(10,10,32),st=[176,164,150],top=17+(rng()*14|0);
  const f=(x,y,z)=>z>2&&rng()<0.06?jit([84,146,84],20,rng):((x===2||x===7)&&(y===2||y===7)?jit(mul(st,.8),14,rng):jit(st,18,rng));
  m.box(1,1,0,9,9,3,f);m.box(2,2,3,8,8,top,f);if(top>27)m.box(1,1,top,9,9,top+2,f);
  else for(let i=0;i<10;i++)m.set(2+rng()*6,2+rng()*6,top,f(3,3,top));return{model:m.bake(),h:top};}
function mkCrate(){const m=new Vox(10,10,9);
  m.box(0,0,0,10,10,9,(x,y,z)=>{const e=(x==0||x==9)+(y==0||y==9)+(z==0||z==8);return e>=2?[92,60,40]:(x+z)%3===0?[150,102,60]:[176,122,72];});
  m.box(4,4,8,6,6,9,[255,210,80]);return m.bake();}
function mkSlime(f){const m=new Vox(12,12,10),c=[110,232,150];const r=Math.random;
  m.ell(6,6,0,5.5,5.5,f?7:8.5,()=>jit(c,14,r));const ex=f?9:10;
  for(const y of[4,7])for(const z of[4,5])m.set(ex,y,z,[20,24,36]);return m.bake();}

// ================= MAP =================
const MAP=2400,T=16,N=MAP/T,GS=0.5;
let ground,islands,LAYERS=[],miniCanvas,MODELS={};
const BIOMES=[
 {g:[92,176,92],leaf:[[72,152,62],[52,124,72]],trees:[0,1,0]},
 {g:[70,166,150],leaf:[[40,128,116],[34,104,110]],trees:[1,1,0]},
 {g:[178,166,86],leaf:[[228,126,52],[204,82,52]],trees:[0,0,1]},
 {g:[126,108,188],leaf:[[246,142,206],[120,220,255]],trees:[2,2,0]}];
function isGround(x,y){if(x<0||y<0||x>=MAP||y>=MAP)return false;return ground[((y/T)|0)*N+((x/T)|0)]>0;}

function genMap(seed){
  const rng=mulberry32(seed),noise=makeNoise(rng);
  islands=[{x:MAP/2,y:MAP/2,r:300,b:0,center:true}];
  let tries=0;
  while(islands.length<16&&tries<5000){tries++;
    const a=rng()*TAU,d=390+rng()*740,r=135+rng()*120,x=MAP/2+Math.cos(a)*d,y=MAP/2+Math.sin(a)*d;
    if(x-r<70||y-r<70||x+r>MAP-70||y+r>MAP-70)continue;
    let ok=true,near=1e9;for(const o of islands){const g=dist(x,y,o.x,o.y)-r-o.r;if(g<75){ok=false;break;}near=Math.min(near,g);}
    if(!ok||near>290)continue;islands.push({x,y,r,b:1+(rng()*3|0)});}
  ground=new Uint8Array(N*N);const bio=new Uint8Array(N*N);
  for(let cy=0;cy<N;cy++)for(let cx=0;cx<N;cx++){const px=(cx+.5)*T,py=(cy+.5)*T;let best=-1,bv=1;
    const nz=(noise(px/110,py/110)-.5)*0.55+(noise(px/38+50,py/38)-.5)*0.2;
    for(let i=0;i<islands.length;i++){const o=islands[i];const d=dist(px,py,o.x,o.y)/o.r+nz;if(d<bv){bv=d;best=i;}}
    if(best>=0){ground[cy*N+cx]=1;bio[cy*N+cx]=islands[best].b;}}
  for(const a of islands){let nb=null,nd=1e9;for(const b of islands)if(b!==a){const d=dist(a.x,a.y,b.x,b.y)-a.r-b.r;if(d<nd){nd=d;nb=b;}}
    if(nb&&rng()<0.5&&!(a.br&&nb.br)){a.br=nb.br=true;const L=dist(a.x,a.y,nb.x,nb.y);
      for(let s=0;s<L;s+=6){const px=lerp(a.x,nb.x,s/L),py=lerp(a.y,nb.y,s/L);
        for(let oy=-14;oy<=14;oy+=4)for(let ox=-14;ox<=14;ox+=4){if(ox*ox+oy*oy>13*13)continue;const cx=((px+ox)/T)|0,cy=((py+oy)/T)|0;
          if(cx>=0&&cy>=0&&cx<N&&cy<N&&ground[cy*N+cx]===0)ground[cy*N+cx]=2;}}}}
  const S=MAP*GS,top=mk(S,S),c0=mk(S,S),c1=mk(S,S),c2=mk(S,S);
  const imgs=[top,c0,c1,c2].map(c=>c.getContext('2d').createImageData(S,S));
  const CL=[[124,96,82],[88,72,86],[52,44,66]];
  const g=(x,y)=>isGround(x,y);
  for(let py=0;py<S;py++)for(let px=0;px<S;px++){const wx=(px+.5)/GS,wy=(py+.5)/GS;const ci=((wy/T)|0)*N+((wx/T)|0);const t=ground[ci];if(!t)continue;
    const i=(py*S+px)*4;let col;
    if(t===2){col=((px>>2)&1)?[150,112,78]:[128,94,64];if((px&3)===0)col=[92,66,48];col=jit(col,10,rng);}
    else{const B=BIOMES[bio[ci]];const n=noise(wx/60,wy/60);col=mul(B.g,0.86+0.26*n);col=jit(col,10,rng);
      const dc=dist(wx,wy,MAP/2,MAP/2);
      if(dc<80){const tx=Math.floor(wx/12),ty=Math.floor(wy/12);col=jit((tx+ty)&1?[168,160,150]:[150,142,136],10,rng);if(((wx|0)%12)<1.6||((wy|0)%12)<1.6)col=[110,104,100];}
      else if(rng()<0.004)col=[[255,240,120],[255,140,190],[240,250,255]][rng()*3|0];
      else if(rng()<0.03)col=mul(col,0.82);}
    if(!g(wx-6,wy)||!g(wx+6,wy)||!g(wx,wy-6)||!g(wx,wy+6))col=mul(col,1.16);
    if(!g(wx-2.5,wy)||!g(wx+2.5,wy)||!g(wx,wy-2.5)||!g(wx,wy+2.5))col=mul(col,0.68);
    const d=imgs[0].data;d[i]=clamp(col[0],0,255);d[i+1]=clamp(col[1],0,255);d[i+2]=clamp(col[2],0,255);d[i+3]=255;
    for(let k=0;k<3;k++){const cc=jit(CL[k],18,rng),dd=imgs[k+1].data;dd[i]=cc[0];dd[i+1]=cc[1];dd[i+2]=cc[2];dd[i+3]=255;}}
  [top,c0,c1,c2].forEach((c,k)=>c.getContext('2d').putImageData(imgs[k],0,0));
  LAYERS=[{c:c2,off:34,a:.25},{c:c2,off:30,a:.55},{c:c2,off:27,a:1},{c:c2,off:24,a:1},{c:c1,off:21,a:1},{c:c1,off:18,a:1},{c:c1,off:15,a:1},{c:c1,off:12,a:1},{c:c0,off:9,a:1},{c:c0,off:6,a:1},{c:c0,off:3,a:1},{c:top,off:0,a:1}];
  miniCanvas=mk(160,160);const mg=miniCanvas.getContext('2d');mg.imageSmoothingEnabled=true;mg.drawImage(top,0,0,160,160);
  MODELS.trees=BIOMES.map(B=>B.trees.map((t,i)=>mkTree(t,B.leaf[i%2],rng)));
  MODELS.rocks=[0,1,2].map(()=>mkRock(rng));
  MODELS.pillars=[0,1,2,3].map(()=>mkPillar(rng));
  MODELS.crate=mkCrate();MODELS.slime=[mkSlime(0),mkSlime(1)];
  return{rng,bio};
}
function biomeAt(x,y,bio){return bio[((y/T)|0)*N+((x/T)|0)]||0;}
function clear(x,y,r){return isGround(x,y)&&isGround(x+r,y)&&isGround(x-r,y)&&isGround(x,y+r)&&isGround(x,y-r)&&isGround(x+r*.7,y+r*.7)&&isGround(x-r*.7,y-r*.7)&&isGround(x+r*.7,y-r*.7)&&isGround(x-r*.7,y+r*.7);}
function groundNear(x,y,r,cl=24){for(let i=0;i<80;i++){const a=SR()*TAU,d=Math.sqrt(SR())*r,px=x+Math.cos(a)*d,py=y+Math.sin(a)*d;if(clear(px,py,cl))return{x:px,y:py};}return{x,y};}

// ================= STATE =================
const PAL=[['#3fd0ff','#ffd23f'],['#ff4d5e','#3a2433'],['#ff9a3c','#3a2a20'],['#b46bff','#ffe0ff'],['#5fe06a','#1f3a2a'],['#ff6bd5','#3a1f35'],['#f2f2f8','#ff4d5e'],['#f5e04a','#3a3520']];
const NAMES=['Vela','Rook','Talon','Ember','Wisp','Quill','Nyx','Drift'];
const TEAMC=['#3fd0ff','#ff4d5e','#5fe06a','#ffd23f'];
const TS={ffa:1,duos:2,squads:4};
const MODES={ffa:['Free-for-all','8 hunters, every one for themselves.'],duos:['Duos','4 teams of 2. Partner up with an AI or a friend.'],squads:['Squads','2 teams of 4. You and AI or friends against another squad.']};
const PH=[{wait:30,r:950,shrink:25,dps:3},{wait:26,r:600,shrink:20,dps:5},{wait:26,r:340,shrink:18,dps:8},{wait:22,r:150,shrink:15,dps:12},{wait:16,r:0,shrink:20,dps:20}];
let mode='menu',time=0,shake=0,shx=0,shy=0,player=null,attractT=0,pend=null,realMatch=false;
let hunters=[],creeps=[],camps=[],obstacles=[],orbs=[],proj=[],nades=[],beams=[],strikes=[],parts=[],texts=[],pads=[],feed=[],announce=null,storm=null;
const cam={x:MAP/2,y:MAP/2,rot:0};let cR=1,sR=0;
const stars=Array.from({length:140},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.6+.3,p:Math.random()*TAU}));
const clouds=Array.from({length:46},()=>({x:Math.random()*MAP*1.4,y:Math.random()*MAP*1.4,r:60+Math.random()*160,a:.025+Math.random()*.05}));
// net

function w2s(x,y,z=0){const dx=x-cam.x,dy=y-cam.y;return{x:W/2+(dx*cR-dy*sR)*zoom+shx,y:H/2+(dx*sR+dy*cR)*zoom-z*zoom+shy};}
function s2w(sx,sy){const rx=(sx-W/2-shx)/zoom,ry=(sy-H/2-shy)/zoom;return{x:cam.x+rx*cR+ry*sR,y:cam.y-rx*sR+ry*cR};}
const newAI=()=>({t:0,target:null,strafe:Math.random()<.5?1:-1,wander:null,lastHit:-9,orb:null,los:false,react:rand(.3,.7),seenT:0});
function mkHunterEnt(i,x,y,team,human,name){const[c,a]=PAL[i];
  return{kind:'hunter',idx:i,team,human,x,y,z:0,vz:0,vx:0,vy:0,ang:SR()*TAU,r:11,hp:100,maxHp:100,armor:50,maxArmor:50,name,col:hx(c),colS:c,
    frames:[mkHunter(c,a,0),mkHunter(c,a,1),mkHunter(c,a,2)],glider:mkGlider(c,a),walk:0,
    cd:{fire:0,rail:0,nade:0,shield:0,dash:0},dashT:0,dvx:0,dvy:0,inv:0,ghostT:0,glide:2.6,maxGlide:2.6,grounded:true,gliding:false,falling:0,jumpHeld:false,
    safeX:x,safeY:y,level:1,xp:0,dmg:1,kills:0,ult:20,shield:0,shieldT:0,alive:true,flash:0,moveX:0,moveY:0,lastHitBy:null,lastHitT:-9,regenT:0,stormAcc:0,
    remote:null,netFire:false,ai:human?null:newAI()};}

function newGame(seed,c,humans,meSlot){
  cfg=Object.assign({},cfg,c||{});const ts=TS[cfg.mode];
  const{rng,bio}=genMap(seed);SR=mulberry32(seed^0x5bd1e995);
  hunters=[];creeps=[];camps=[];obstacles=[];orbs=[];proj=[];nades=[];beams=[];strikes=[];parts=[];texts=[];pads=[];feed=[];announce=null;
  time=0;pend=null;matchOver=false;winTeam=-1;myTeamPlace=0;attractT=0;myIdx=meSlot;
  const others=islands.slice(1);for(let i=others.length-1;i>0;i--){const j=SR()*(i+1)|0;[others[i],others[j]]=[others[j],others[i]];}
  const bases=[];for(let t=0;t<8/ts;t++){const isl=others[t%others.length];bases.push({isl,p:groundNear(isl.x,isl.y,isl.r*.4,30)});}
  for(let i=0;i<8;i++){const team=Math.floor(i/ts),b=bases[team],hu=humans.find(h=>h.slot===i);
    const p=i%ts===0?b.p:groundNear(b.p.x,b.p.y,70,24);
    const h=mkHunterEnt(i,p.x,p.y,team,!!hu,hu?hu.name:NAMES[i]);h.isl=b.isl;hunters.push(h);}
  player=meSlot>=0?hunters[meSlot]:null;
  const free=islands.filter(s=>!hunters.some(h=>h.isl===s));
  for(const s of free.slice(0,5)){const p=groundNear(s.x,s.y,s.r*.3,40);camps.push({x:p.x,y:p.y,respawn:0});}
  camps.forEach(spawnCamp);
  for(const s of islands){const n=s.center?2:(SR()<.45?1:0);for(let k=0;k<n;k++){const p=groundNear(s.x,s.y,s.r*.75,30);pads.push({x:p.x,y:p.y});}}
  let oid=0;
  for(const s of islands){const cnt=Math.floor(s.r*s.r/3600);
    for(let k=0,att=0;k<cnt&&att<cnt*8;att++){const p=groundNear(s.x,s.y,s.r*.95,26);
      if(hunters.some(h=>dist(h.x,h.y,p.x,p.y)<70)||pads.some(q=>dist(q.x,q.y,p.x,p.y)<55)||camps.some(c=>dist(c.x,c.y,p.x,p.y)<90))continue;
      if(dist(p.x,p.y,MAP/2,MAP/2)<85)continue;
      const r0=rng();let o;const b=biomeAt(p.x,p.y,bio);
      if(r0<(s.center?.3:.55)){const ms=MODELS.trees[b];o={kind:'tree',model:ms[rng()*ms.length|0],sc:3,r:10,h:72};}
      else if(r0<(s.center?.5:.74))o={kind:'rock',model:MODELS.rocks[rng()*3|0],sc:3,r:17,h:28};
      else if(r0<(s.center?.85:.86)){const pm=MODELS.pillars[rng()*4|0];o={kind:'pillar',model:pm.model,sc:2.5,r:11,h:pm.h*2.5};}
      else o={kind:'crate',model:MODELS.crate,sc:2.3,r:12,h:20,hp:25,flash:0};
      if(obstacles.some(q=>dist(q.x,q.y,p.x,p.y)<q.r+o.r+18))continue;
      o.x=p.x;o.y=p.y;o.ang=rng()*TAU;o.id=oid++;obstacles.push(o);k++;}}
  storm={x:MAP/2,y:MAP/2,r:1750,phase:0,timer:PH[0].wait,shrinking:false,t0:0,dur:1,sx:0,sy:0,sr:0,tx:MAP/2,ty:MAP/2,tr:PH[0].r};pickStorm();
  const f=player||hunters[0];cam.x=f.x;cam.y=f.y;
  SR=Math.random;
}
function pickStorm(){const ph=PH[storm.phase];if(!ph)return;
  const md=Math.min(500,Math.max(0,storm.r-ph.r)*.6);let p={x:storm.x,y:storm.y};
  for(let i=0;i<60;i++){const a=Math.random()*TAU,d=Math.random()*md,x=storm.x+Math.cos(a)*d,y=storm.y+Math.sin(a)*d;if(isGround(x,y)&&(ph.r>250||clear(x,y,30))){p={x,y};break;}}
  storm.tx=p.x;storm.ty=p.y;storm.tr=ph.r;}
function spawnCamp(c){for(let i=0;i<3;i++){const p=groundNear(c.x,c.y,50,16);
  creeps.push({kind:'creep',x:p.x,y:p.y,z:0,vz:0,vx:0,vy:0,hx:c.x,hy:c.y,hp:60,maxHp:60,r:12,aggro:null,hopT:Math.random(),atk:0,flash:0,ang:Math.random()*TAU,alive:true,camp:c});}}
const enemies=(a,b)=>a.team!==b.team;
const aliveTeams=()=>new Set(hunters.filter(h=>h.alive).map(h=>h.team));

// ================= AUDIO =================
let AC=null,muted=false,nbuf=null;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate;nbuf=AC.createBuffer(1,n,n);const d=nbuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,dur,type,vol,slide=0){if(!AC||muted||vol<=0)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.02);}
function boomSnd(vol,dur=.45,fq=900){if(!AC||muted||vol<=0)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nbuf;f.type='lowpass';f.frequency.setValueAtTime(fq,t);f.frequency.exponentialRampToValueAtTime(60,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(AC.destination);s.start(t);s.stop(t+dur);}
function vol(x,y){const d=dist(x,y,cam.x,cam.y);return d>800?0:1-d/800;}
const sfx={
  shoot:(v)=>tone(820,.06,'square',.018*v,-380),hit:(v)=>tone(260,.05,'square',.03*v,-120),boom:(v)=>boomSnd(.3*v),dash:(v)=>tone(280,.15,'sawtooth',.025*v,520),
  jump:(v)=>tone(240,.22,'triangle',.06*v,320),rail:(v)=>{tone(1500,.32,'sawtooth',.035*v,-1300);boomSnd(.1*v,.2,3000);},
  level:()=>{tone(523,.12,'triangle',.07);setTimeout(()=>tone(784,.22,'triangle',.07),110);},pick:(v)=>tone(950,.07,'sine',.05*v,450),
  shield:(v)=>tone(480,.3,'sine',.06*v,300),hurt:()=>tone(140,.12,'sawtooth',.06,-60),kill:()=>{tone(660,.1,'square',.04);setTimeout(()=>tone(990,.15,'square',.04),90);},
  pad:(v)=>tone(200,.4,'sine',.08*v,700),ult:(v)=>tone(300,.6,'sawtooth',.04*v,900)};

// ================= FX (visual events; host relays them to clients) =================
const evq=[];
function fx(...e){applyFx(e);if(net.role==='host')evq.push(e);}
function applyFx(e){const k=e[0];
  switch(k){
  case 'shot':{const[,x,y,z,vx,vy,o]=e;if(net.role==='client'){if(o===myIdx)return;const ow=hunters[o];if(ow)proj.push({x,y,z,vx,vy,owner:ow,dmg:0,life:.6,col:ow.col,cos:1});}
    parts.push({x,y,z,vx:0,vy:0,vz:0,life:.06,max:.06,size:7,col:[255,240,200],glow:1});sfx.shoot(vol(x,y));break;}
  case 'burst':burst(e[1],e[2],e[3],e[4],e[5]);break;
  case 'puff':puff(e[1],e[2],e[3]);break;
  case 'ring':parts.push({x:e[1],y:e[2],z:2,vx:0,vy:0,vz:0,life:.5,max:.5,ring:e[3],col:e[4]});break;
  case 'boom':{const[,x,y,R,col]=e;
    for(let i=0;i<26;i++){const a=Math.random()*TAU,s=rand(60,260);parts.push({x,y,z:4,vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:rand(60,260),life:rand(.3,.7),max:.7,size:rand(3,6),col:i%3?[255,170,60]:[255,240,160],grav:1,glow:i%2});}
    parts.push({x,y,z:2,vx:0,vy:0,vz:0,life:.35,max:.35,ring:R,col});shake=Math.max(shake,10*vol(x,y));sfx.boom(vol(x,y));break;}
  case 'rail':{const[,x1,y1,x2,y2,z,o]=e,ow=hunters[o];beams.push({x1,y1,x2,y2,z,life:.35,max:.35,col:ow.col});
    for(let i=0;i<10;i++)parts.push({x:x2,y:y2,z,vx:rand(-120,120),vy:rand(-120,120),vz:rand(0,160),life:.4,max:.4,size:3,col:ow.col,grav:1});
    if(o===myIdx)shake=Math.max(shake,6);sfx.rail(vol(x1,y1));break;}
  case 'sky':beams.push({x1:e[1],y1:e[2],x2:e[1],y2:e[2],z:0,sky:1,life:.3,max:.3,col:hunters[e[3]].col});break;
  case 'nade':if(net.role==='client'){const[,sx,sy,z0,tx,ty,o]=e;nades.push({sx,sy,x:sx,y:sy,z:z0,z0,tx,ty,t:0,dur:.7,owner:hunters[o],cos:1});}break;
  case 'strike':if(net.role==='client'){const[,x,y,t,o]=e;strikes.push({x,y,t,max:t,owner:hunters[o],cos:1});}break;
  case 'txt':{const[,v,x,y,z,txt,col,big]=e;if(v!==myIdx)return;texts.push({x,y,z,txt,col,life:.8,big});break;}
  case 'ann':{const[,v,t,s,c]=e;if(v>=0&&v!==myIdx)return;announce={t,s,c,life:1.8};break;}
  case 'feed':feed.unshift({k:e[1],kc:e[2],v:e[3],vc:e[4],t:time});if(feed.length>6)feed.pop();break;
  case 'snd':{const[,n,x,y,v,ex]=e;if(v>=0&&v!==myIdx)return;if(ex===myIdx&&ex>=0)return;sfx[n](v>=0?1:vol(x,y));if(n==='hurt')shake=Math.max(shake,4);break;}
  case 'kb':if(net.role==='client'&&e[1]===myIdx&&player){player.vx+=e[2];player.vy+=e[3];}break;
  case 'od':obstacles=obstacles.filter(o=>o.id!==e[1]);break;
  case 'tdead':if(player&&e[1]===player.team&&!matchOver){myTeamPlace=e[2];pend={type:'elim',t:1.6};}break;
  case 'over':matchOver=true;winTeam=e[1];inMatch=false;if(player)pend={type:'final',t:2.2};else attractT=4;
    if(net.role==='host'&&net.code)setTimeout(broadcastLobby,50);break;
  }}
function burst(x,y,z,col,n){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=rand(40,200);parts.push({x,y,z,vx:Math.cos(a)*s,vy:Math.sin(a)*s,vz:rand(40,260),life:rand(.4,.9),max:.9,size:rand(2.5,5),col:jit(col,40,Math.random),grav:1});}}
function puff(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*TAU;parts.push({x,y,z:1,vx:Math.cos(a)*50,vy:Math.sin(a)*50,vz:rand(10,40),life:.4,max:.4,size:rand(3,5),col:[220,215,230],grav:0,fade:1});}}
const C=c=>c.map(v=>v|0);

// ================= COMBAT (host / solo authority) =================
function gunPos(h){const c=Math.cos(h.ang),s=Math.sin(h.ang);return{x:h.x+c*14-s*10,y:h.y+s*14+c*10};}
function canAct(h){return h.alive&&h.falling===0;}
function fire(h){if(!canAct(h)||h.cd.fire>0)return;h.cd.fire=h.human?.15:.3;
  const a=h.ang+(h.human?rand(-.035,.035):rand(-.11,.11)),g=gunPos(h),vx=Math.cos(a)*740,vy=Math.sin(a)*740;
  proj.push({x:g.x,y:g.y,z:h.z+15,vx,vy,owner:h,dmg:9*h.dmg,life:.6,col:h.col});
  fx('shot',r1(g.x),r1(g.y),r1(h.z+15),r1(vx),r1(vy),h.idx);}
function localShot(h){if(!canAct(h)||h.cd.fire>0)return;h.cd.fire=.15;const a=h.ang+rand(-.035,.035),g=gunPos(h);
  proj.push({x:g.x,y:g.y,z:h.z+15,vx:Math.cos(a)*740,vy:Math.sin(a)*740,owner:h,dmg:0,life:.6,col:h.col,cos:1});
  parts.push({x:g.x,y:g.y,z:h.z+15,vx:0,vy:0,vz:0,life:.06,max:.06,size:7,col:[255,240,200],glow:1});sfx.shoot(1);}
function rayObstacle(x,y,c,s,len,z){let end=len;for(const o of obstacles){if(z>o.h)continue;const dx=o.x-x,dy=o.y-y,t=dx*c+dy*s;if(t<0||t>end+o.r)continue;
  const p=Math.abs(-dx*s+dy*c);if(p<o.r){const ht=t-Math.sqrt(o.r*o.r-p*p);if(ht<end)end=Math.max(0,ht);}}return end;}
function rail(h){if(!canAct(h)||h.cd.rail>0)return;h.cd.rail=h.human?4.5:7;
  const c=Math.cos(h.ang),s=Math.sin(h.ang),g=gunPos(h),end=rayObstacle(g.x,g.y,c,s,640,h.z+15);
  for(const t of[...hunters,...creeps]){if(t===h||!t.alive||(t.falling>0))continue;if(t.kind==='hunter'&&!enemies(t,h))continue;if(Math.abs((t.z||0)-h.z)>40)continue;
    const dx=t.x-g.x,dy=t.y-g.y,tt=dx*c+dy*s;if(tt<0||tt>end)continue;if(Math.abs(-dx*s+dy*c)<t.r+8)hurt(t,40*h.dmg,h,{kb:[c*260,s*260]});}
  fx('rail',r1(g.x),r1(g.y),r1(g.x+c*end),r1(g.y+s*end),r1(h.z+15),h.idx);
  if(!h.remote){h.vx-=c*120;h.vy-=s*120;}}
function nade(h,tx,ty){if(!canAct(h)||h.cd.nade>0)return;h.cd.nade=h.human?7:9;const d=dist(h.x,h.y,tx,ty),m=Math.min(d,380)/(d||1);
  const n={sx:h.x,sy:h.y,x:h.x,y:h.y,z:h.z+15,z0:h.z+15,tx:h.x+(tx-h.x)*m,ty:h.y+(ty-h.y)*m,t:0,dur:.7,owner:h};nades.push(n);
  fx('nade',r1(n.sx),r1(n.sy),r1(n.z0),r1(n.tx),r1(n.ty),h.idx);}
function shieldUp(h){if(!canAct(h)||h.cd.shield>0)return;h.cd.shield=12;h.shield=60;h.shieldT=2.6;fx('snd','shield',r1(h.x),r1(h.y),-1);}
function dash(h){if(!canAct(h)||h.cd.dash>0)return;h.cd.dash=2.4;let dx=h.moveX,dy=h.moveY;if(Math.hypot(dx,dy)<.1){dx=Math.cos(h.ang);dy=Math.sin(h.ang);}
  const l=Math.hypot(dx,dy);h.dvx=dx/l*680;h.dvy=dy/l*680;h.dashT=.17;h.inv=.22;fx('snd','dash',r1(h.x),r1(h.y),-1);}
function jump(h){if(!canAct(h)||!h.grounded)return;h.grounded=false;h.vz=330;fx('snd','jump',r1(h.x),r1(h.y),-1);fx('puff',r1(h.x),r1(h.y),6);}
function ult(h,tx,ty){if(!canAct(h)||h.ult<100)return;h.ult=0;const d=dist(h.x,h.y,tx,ty),m=Math.min(d,420)/(d||1);tx=h.x+(tx-h.x)*m;ty=h.y+(ty-h.y)*m;
  for(let i=0;i<8;i++){const a=Math.random()*TAU,r=i?Math.sqrt(Math.random())*120:0,s={x:tx+Math.cos(a)*r,y:ty+Math.sin(a)*r,t:.55+i*.11,owner:h};s.max=s.t;strikes.push(s);fx('strike',r1(s.x),r1(s.y),r2(s.t),h.idx);}
  if(h.human)fx('ann',h.idx,'STARFALL','',C(h.col));fx('snd','ult',r1(h.x),r1(h.y),-1);}
function explode(x,y,R,dmg,owner,kb=380){
  for(const t of[...hunters,...creeps]){if(!t.alive||t.falling>0)continue;const d=dist(x,y,t.x,t.y);if(d>R+t.r||(t.z||0)>60)continue;
    const f=1-clamp(d/(R+t.r),0,1)*.45,ux=(t.x-x)/(d||1),uy=(t.y-y)/(d||1);hurt(t,dmg*f,owner,{kb:[ux*kb*f,uy*kb*f]});}
  for(const o of obstacles)if(o.kind==='crate'&&dist(x,y,o.x,o.y)<R+o.r)hurt(o,dmg,owner);
  fx('boom',r1(x),r1(y),R,owner?C(owner.col):[255,200,100]);}
function hurt(t,amt,src,o={}){
  if(t.kind==='hunter'){if(!t.alive||(t.inv>0&&!o.true))return;
    if(src===t)return;if(src&&src.kind==='hunter'&&!enemies(src,t))return;
    if(src&&src.kind==='hunter'&&src!==t){t.lastHitBy=src;t.lastHitT=time;src.ult=Math.min(100,src.ult+amt*.45);}
    let a=amt,absorbed=0;if(t.shield>0){const s=Math.min(t.shield,a);t.shield-=s;a-=s;absorbed+=s;}
    let ar=0;if(a>0&&t.armor>0&&!o.true){ar=Math.min(t.armor,a);t.armor-=ar;a-=ar;if(t.armor<=0)fx('burst',r1(t.x),r1(t.y),r1(t.z+16),[120,180,255],10);}
    t.hp-=a;t.flash=.08;t.regenT=6;
    if(o.kb){if(t.remote)fx('kb',t.idx,r1(o.kb[0]),r1(o.kb[1]));else{t.vx+=o.kb[0];t.vy+=o.kb[1];}}
    if(t.ai){t.ai.lastHit=time;if(src&&src.kind==='hunter')t.ai.aggro=src;}
    const n=Math.round(amt);
    if(!o.storm&&n>0){if(src&&src.human&&src!==t){fx('txt',src.idx,r1(t.x+rand(-6,6)),r1(t.y),r1(t.z+38),n,absorbed>=amt?'#bff':ar>0?'#8fc4ff':'#fff',amt>=30);fx('snd','hit',0,0,src.idx);}
      if(t.human){fx('txt',t.idx,r1(t.x+rand(-6,6)),r1(t.y),r1(t.z+38),n,'#ff6b7a',amt>=30);fx('snd','hurt',0,0,t.idx);}}

    else{const map={ult:['ult',0,1,P.ult/100],shield:['shield',P.cd.shield,12],nade:['nade',P.cd.nade,7],rail:['rail',P.cd.rail,4.5],dash:['dash',P.cd.dash,2.4],jump:['jump',0,1,P.glide/P.maxGlide]};
      for(const b of buttons){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fillStyle='rgba(12,9,28,.6)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.stroke();
        const m=map[b.id];if(m){const ready=b.id==='ult'?P.ult>=100:m[1]<=0;icon(m[0],b.x,b.y,b.r*1.1,ready?'#fff':'#777');
          if(m[1]>0){ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.arc(b.x,b.y,b.r,-Math.PI/2,-Math.PI/2+TAU*clamp(m[1]/m[2],0,1));ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(Math.ceil(m[1]),b.x,b.y+5);}
          if(m[3]!==undefined){ctx.strokeStyle=m[3]>=1?'#ffd23f':'#9ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,b.r+3,-Math.PI/2,-Math.PI/2+TAU*clamp(m[3],0,1));ctx.stroke();}}
        else{ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(b.l,b.x,b.y+5);}}
      for(const id in tch){const t=tch[id];if(t.type==='btn')continue;ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.ox,t.oy,50,0,TAU);ctx.stroke();ctx.fillStyle=t.type==='aim'?'rgba(255,210,63,.5)':'rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(t.x,t.y,20,0,TAU);ctx.fill();}}
  }else{ctx.textAlign='center';ctx.font='bold 15px "Trebuchet MS",sans-serif';ctx.fillStyle='rgba(12,9,28,.75)';rr(W/2-130,H-62,260,40,10);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillText('Spectating '+F.name,W/2,H-37);
    if(touchMode){const b=buttons.find(b=>b.id==='pause');ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.fillStyle='rgba(12,9,28,.6)';ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.fillText('II',b.x,b.y+5);}}
  if(announce){const a=announce,k=Math.min(1,a.life*2),sc2=1+Math.max(0,a.life-1.5)*.6;ctx.globalAlpha=k;ctx.textAlign='center';ctx.font=`bold ${Math.round(Math.min(40,W/14)*sc2)}px "Trebuchet MS",sans-serif`;
    ctx.lineWidth=5;ctx.strokeStyle='rgba(10,5,25,.85)';ctx.strokeText(a.t,W/2,H*.3);ctx.fillStyle=rgb(a.c);ctx.fillText(a.t,W/2,H*.3);
    if(a.s){ctx.font='bold 16px "Trebuchet MS",sans-serif';ctx.lineWidth=4;ctx.strokeText(a.s,W/2,H*.3+26);ctx.fillStyle='#fff';ctx.fillText(a.s,W/2,H*.3+26);}ctx.globalAlpha=1;}
  if(P.alive&&dist(P.x,P.y,storm.x,storm.y)>storm.r){ctx.fillStyle=`rgba(160,60,255,${.12+.08*Math.sin(time*6)})`;ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.font='bold 14px "Trebuchet MS",sans-serif';ctx.fillStyle='#e6c8ff';ctx.fillText('YOU ARE IN THE STORM',W/2,H*.18);}
}

// ================= SCREENS =================
function controlsHTML(){return touchMode?
 `<div class="ctl"><b>Left thumb</b><span>Move</span><b>Right thumb</b><span>Aim & auto-fire (light aim assist)</span><b>JUMP</b><span>Jump · hold to glide over the abyss</span><b>DASH</b><span>Dodge with i-frames</span><b>RAIL / Q / E / R</b><span>Piercing rail · grenade · shield · Starfall ultimate</span><b>⟲ ⟳</b><span>Rotate the camera</span></div>`:
 `<div class="ctl"><b>WASD</b><span>Move</span><b>Mouse / LMB</b><span>Aim · fire bolts</span><b>RMB or F</b><span>Rail shot (pierces)</span><b>Q</b><span>Grenade at cursor</span><b>E</b><span>Shield bubble</span><b>R</b><span>Starfall ultimate (charge by dealing damage)</span><b>SHIFT</b><span>Dash (i-frames)</span><b>SPACE</b><span>Jump · hold to glide · auto-glides off ledges</span><b>Z / C · X</b><span>Rotate camera · reset</span><b>P · M</b><span>Menu/pause · mute</span></div>`;}
function show(html){ov.className='';ov.innerHTML=`<div class="panel">${html}</div>`;cvs.style.cursor='';}
function modeSeg(id){return`<div class="seg" id="${id}">${Object.keys(MODES).map(k=>`<button data-m="${k}" class="${cfg.mode===k?'on':''}">${MODES[k][0]}</button>`).join('')}</div><div class="desc" id="${id}D">${MODES[cfg.mode][1]}</div>`;}
function bindSeg(id,cb){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.m;document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));const d=document.getElementById(id+'D');if(d)d.textContent=MODES[cfg.mode][1];cb&&cb();});}
function readName(){const el=document.getElementById('nm');if(el){myName=cleanName(el.value);try{localStorage.setItem('skyrift-name',myName);}catch(e){}}}
function showMenu(){mode='menu';
  show(`<h1>SKYRIFT</h1><div class="sub">Sprite-stacked sky-island battle royale</div>
  <input class="inp" id="nm" maxlength="12" value="${esc(myName)}" aria-label="Your name" placeholder="Your name">
  <div>${modeSeg('ms')}</div>
  <button class="play" id="pb" data-enter>PLAY SOLO</button>
  <div class="row"><button class="btn2" id="hb">Host online game</button><button class="btn2" id="jb">Join with code</button></div>
  ${controlsHTML()}<div class="tip">Glide across the abyss, hit the launch pads, farm slime camps for XP and loot,<br>and be the last hunter (or team) standing.</div>`);
  bindSeg('ms');
  document.getElementById('pb').onclick=()=>{readName();initAudio();teardown();startMatch((Math.random()*1e9)|0,cfg,[{slot:0,name:myName}],0);};
  document.getElementById('hb').onclick=()=>{readName();initAudio();startHost();};
  document.getElementById('jb').onclick=()=>{readName();showJoin();};}
function showJoin(err,code){mode='lobby';
  show(`<h2>JOIN</h2><div class="sub">Enter your friend's room code</div>${err?`<div class="err">${esc(err)}</div>`:''}
  <input class="inp" id="nm" maxlength="12" value="${esc(myName)}" placeholder="Your name" aria-label="Your name"><br>
  <input class="inp code" id="cd" maxlength="5" value="${esc(code||'')}" placeholder="CODE" autocomplete="off" autocapitalize="characters" aria-label="Room code"><br>
  <button class="play" id="go" data-enter>JOIN</button><br><button class="ghost" id="bk">Back</button>`);
  document.getElementById('go').onclick=()=>{readName();initAudio();startJoin(document.getElementById('cd').value);};
  document.getElementById('bk').onclick=()=>{teardown();showMenu();};
  setTimeout(()=>{const c=document.getElementById('cd');c&&!touchMode&&c.focus();},50);}
function showWait(msg){show(`<h2 style="font-size:28px">${esc(msg)}</h2><button class="ghost" id="bk">Cancel</button>`);document.getElementById('bk').onclick=()=>{teardown();showMenu();};}
function showError(msg,hint){mode='lobby';show(`<h2 style="font-size:30px">Hmm.</h2><div class="err">${esc(msg)}</div>${hint?`<div class="tip">${esc(hint)}</div>`:''}<br><button class="play" id="bk">BACK</button>`);
  document.getElementById('bk').onclick=()=>{teardown();showMenu();};}
function inviteLink(){return location.origin+location.pathname+'#join-'+net.code;}
function plist(names,lcfg){const ts=TS[lcfg.mode];let slots=Array.from({length:names.length},(_,i)=>i);if(ts>1&&!lcfg.together){const nt=8/ts;slots=names.map((_,i)=>(i%nt)*ts+Math.floor(i/nt));}
  return `<div class="plist">${names.map((n,i)=>`<div><span class="dot" style="background:${PAL[slots[i]][0]}"></span><span style="flex:1">${esc(n)}${i===0?' <span style="opacity:.6">(host)</span>':''}</span>${ts>1?`<span style="opacity:.7;font-size:12px">Team ${Math.floor(slots[i]/ts)+1}</span>`:''}</div>`).join('')}
   <div style="opacity:.6;justify-content:center">+ ${8-names.length} AI hunters fill the rest</div></div>`;}
function showHostLobby(){mode='lobby';const names=lobbyNames(),ts=TS[cfg.mode];
  show(`<h3>ROOM CODE</h3><div class="bigcode">${esc(net.code)}</div>
  <div class="row" style="margin-top:4px"><button class="btn2" id="cp">Copy invite link</button></div><div class="link" id="lk">${esc(inviteLink())}</div>
  ${plist(names,cfg)}
  <div>${modeSeg('hs')}</div>
  ${ts>1?`<div class="seg" id="tg"><button data-t="1" class="${cfg.together?'on':''}">Friends together</button><button data-t="0" class="${cfg.together?'':'on'}">Friends as rivals</button></div><br><br>`:''}
  <button class="play" id="st">START</button><br><button class="ghost" id="lv">Close room</button>`);
  bindSeg('hs',()=>{broadcastLobby();showHostLobby();});
  document.querySelectorAll('#tg button').forEach(b=>b.onclick=()=>{cfg.together=b.dataset.t==='1';broadcastLobby();showHostLobby();});
  document.getElementById('cp').onclick=async()=>{const b=document.getElementById('cp');try{await navigator.clipboard.writeText(inviteLink());b.textContent='Copied!';}catch(e){b.textContent='Copy the link below';}};
  document.getElementById('st').onclick=()=>{initAudio();hostStart();};
  document.getElementById('lv').onclick=()=>{leaveToMenu();};}
function showClientLobby(){mode='lobby';const L=net.lobby;if(!L)return;
  show(`<h3>ROOM</h3><div class="bigcode">${esc(L.code||net.code)}</div>${plist(L.names||[],L.cfg)}
  <div class="desc"><b>${esc(MODES[L.cfg.mode][0])}</b> — ${esc(MODES[L.cfg.mode][1])}</div>
  <div class="sub">Waiting for the host to start…</div><button class="ghost" id="lv">Leave</button>`);
  document.getElementById('lv').onclick=()=>{leaveToMenu();};}
function startMatch(seed,c,humans,me){newGame(seed,c,humans,me);realMatch=true;inMatch=true;mode='play';ov.className='hide';cvs.style.cursor=touchMode?'':'none';camTarget.cur=null;}
function startAttract(){newGame((Math.random()*1e9)|0,{mode:'ffa'},[],-1);realMatch=false;}
function leaveToMenu(){teardown();startAttract();showMenu();}
function statsLine(){const P=player;return`Eliminations: <b>${P.kills}</b> · Level <b>${P.level}</b> · Time <b>${Math.floor(time/60)}:${String(Math.floor(time%60)).padStart(2,'0')}</b>`;}
function endButtons(final){
  if(net.role==='client')return`<div class="sub">${final?'Waiting for the host to start the next match…':''}</div><button class="ghost" id="lv">Leave game</button>`;
  if(net.role==='host')return`<button class="play" id="ag">PLAY AGAIN</button><br><button class="ghost" id="lb">Back to lobby</button> <button class="ghost" id="lv">Close room</button>`;
  return`<button class="play" id="ag">PLAY AGAIN</button><br><button class="ghost" id="lv">Menu</button>`;}
function bindEnd(){const ag=document.getElementById('ag'),lb=document.getElementById('lb'),lv=document.getElementById('lv'),sp=document.getElementById('sp');
  if(ag)ag.onclick=()=>{if(net.role==='host')hostStart();else startMatch((Math.random()*1e9)|0,cfg,[{slot:0,name:myName}],0);};
  if(lb)lb.onclick=()=>{realMatch=false;inMatch=false;startAttract();mode='lobby';broadcastLobby(true);showHostLobby();};
  if(lv)lv.onclick=()=>leaveToMenu();
  if(sp)sp.onclick=()=>{ov.className='hide';mode='play';};}
function showElim(){if(mode==='paused')return;mode='over';const nt=8/TS[cfg.mode];
  show(`<h2 style="color:#ff6b7a">ELIMINATED</h2><div class="stats">${cfg.mode==='ffa'?'You':'Your team'} placed <b>#${myTeamPlace}</b> of ${nt}<br>${statsLine()}</div>
  <button class="btn2" id="sp">Spectate</button><br><br>${net.role==='client'?endButtons(false):net.role==='host'?`<button class="ghost" id="lv">Close room</button>`:endButtons(false)}`);bindEnd();}
function showResult(){mode='over';const win=player&&winTeam===player.team,nt=8/TS[cfg.mode];
  const place=win?1:(myTeamPlace||2);
  show(`<h2 style="color:${win?'#ffd23f':'#ff6b7a'}">${win?'VICTORY':cfg.mode==='ffa'?'ELIMINATED':'DEFEAT'}</h2>
  <div class="stats">${win?(cfg.mode==='ffa'?'Last hunter standing!':'Your team is the last one flying!'):`${cfg.mode==='ffa'?'You':'Your team'} placed <b>#${place}</b> of ${nt}`}<br>${statsLine()}</div>${endButtons(true)}`);bindEnd();}
function togglePause(){
  if(net.role==='solo'&&mode==='play'&&realMatch&&player.alive){mode='paused';show(`<h2>PAUSED</h2>${controlsHTML()}<br><button class="play" id="pb">RESUME</button><br><button class="ghost" id="mb">Quit to menu</button>`);
    document.getElementById('pb').onclick=togglePause;document.getElementById('mb').onclick=leaveToMenu;return;}
  if(mode==='paused'){mode='play';ov.className='hide';cvs.style.cursor=touchMode?'':'none';return;}
  if(mode==='play'&&realMatch){if(!ov.classList.contains('hide')){ov.className='hide';return;}
    show(`<h2>MENU</h2><div class="sub">${net.role==='solo'?'':'The match keeps going while this is open'}</div>${controlsHTML()}<br><button class="play" id="pb">RESUME</button><br><button class="ghost" id="mb">${net.role==='host'?'Close room':'Leave game'}</button>`);
    document.getElementById('pb').onclick=()=>{ov.className='hide';cvs.style.cursor=touchMode?'':'none';};document.getElementById('mb').onclick=leaveToMenu;}}

// ================= LOOP =================
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;
  try{if(mode!=='paused')update(dt);else{cR=Math.cos(cam.rot);sR=Math.sin(cam.rot);}render();}catch(e){console.error(e);}
  requestAnimationFrame(loop);}
addEventListener('resize',resize);resize();startAttract();
{const m=location.hash.match(/^#join-([A-Za-z0-9]{5})$/);if(m)showJoin('',m[1].toUpperCase());else showMenu();}
requestAnimationFrame(loop);
</script>
</body>
